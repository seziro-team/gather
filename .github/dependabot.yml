version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR per ecosystem keeps review manageable; security updates still come
      # through separately and immediately.
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@playwright/*'
      next:
        patterns:
          - 'next'
          - '@next/*'
          - 'react'
          - 'react-dom'
      data:
        patterns:
          - 'drizzle-*'
          - 'pg'
          - '@types/pg'
      auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
