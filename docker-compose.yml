name: gather

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gather}
      POSTGRES_DB: ${POSTGRES_DB:-gather}
    volumes:
      # Postgres 18's image expects a single mount at /var/lib/postgresql and places the
      # cluster in a version-named subdirectory; mounting .../data instead makes the
      # container refuse to start. See docker-library/postgres#1259.
      - gather-db:/var/lib/postgresql
    # Bound to loopback only: this is here so host-side tooling (psql, pnpm verify:audit)
    # can reach the database. It is never exposed to the network.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gather} -d ${POSTGRES_DB:-gather} -q']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit: without a target, Docker builds the *last* stage in the file, which is
      # the worker. Adding a second runtime image is exactly how that trap gets set.
      target: runner
    image: gather/web:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Built from the POSTGRES_* values above so one place defines the credentials.
      DATABASE_URL: postgres://${POSTGRES_USER:-gather}:${POSTGRES_PASSWORD:-gather}@db:5432/${POSTGRES_DB:-gather}
      GATHER_APP_URL: ${GATHER_APP_URL:-http://localhost:3000}
      # Optional: left empty, the container generates one on first boot and keeps it
      # in the gather-data volume. See docker/entrypoint.sh.
      GATHER_AUTH_SECRET: ${GATHER_AUTH_SECRET:-}
      GATHER_ALLOW_SIGNUP: ${GATHER_ALLOW_SIGNUP:-first-user-only}
      GATHER_REQUIRE_2FA: ${GATHER_REQUIRE_2FA:-true}
      GATHER_TRUST_PROXY: ${GATHER_TRUST_PROXY:-false}
      GATHER_RATE_LIMIT: ${GATHER_RATE_LIMIT:-true}
      GATHER_AUTH_RATE_LIMIT: ${GATHER_AUTH_RATE_LIMIT:-true}
      GATHER_RETENTION_DAYS: ${GATHER_RETENTION_DAYS:-0}
      ANTIVIRUS_DRIVER: ${ANTIVIRUS_DRIVER:-none}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-120000}
      GATHER_LOG_LEVEL: ${GATHER_LOG_LEVEL:-info}
      GATHER_AUTO_MIGRATE: ${GATHER_AUTO_MIGRATE:-true}
      GATHER_DATA_DIR: /app/data
      # Storage. Left as-is this is a directory in the gather-data volume below and
      # nothing else runs; see docker-compose.s3.yml for the object-store path.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ENCRYPTION: ${STORAGE_ENCRYPTION:-on}
      # Optional: empty and the container generates one on first boot into the data
      # volume, next to the files. See docker/entrypoint.sh.
      GATHER_ENCRYPTION_KEY: ${GATHER_ENCRYPTION_KEY:-}
      GATHER_MAX_UPLOAD_MB: ${GATHER_MAX_UPLOAD_MB:-100}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      GATHER_PORTAL_LINK_DAYS: ${GATHER_PORTAL_LINK_DAYS:-30}
      GATHER_PORTAL_SESSION_HOURS: ${GATHER_PORTAL_SESSION_HOURS:-72}
      # Email. The worker sends scheduled reminders; the web app sends the manual
      # "send one now", through the same code and the same send-once guard.
      MAIL_DRIVER: ${MAIL_DRIVER:-none}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_VALID_CERT: ${SMTP_REQUIRE_VALID_CERT:-true}
      # The hosted tier. Off here, and off is the whole product with no limits —
      # see .env.example. docker-compose.prod.yml is where you would turn it on.
      GATHER_CLOUD: ${GATHER_CLOUD:-false}
      GATHER_ADMIN_EMAILS: ${GATHER_ADMIN_EMAILS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_CLOUD: ${STRIPE_PRICE_CLOUD:-}
      STRIPE_PRICE_CLOUD_PRO: ${STRIPE_PRICE_CLOUD_PRO:-}
    volumes:
      # Holds the generated signing secret, the file-encryption key, and the local storage
      # driver's uploads. Backing this up is backing up Gather's state, alongside the
      # database — and without the key in it, the uploads are unreadable.
      - gather-data:/app/data
    ports:
      - '${GATHER_PORT:-3000}:3000'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/api/health | grep -q ''"status":"ok"''']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # The reminder engine. Its own container so a slow mail server cannot make the
  # dashboard slow, and so restarting the sender does not sign anyone out.
  #
  # Safe to scale to more than one: schedules are claimed with FOR UPDATE SKIP
  # LOCKED and every send is guarded by a unique index, so two workers divide the
  # work rather than duplicating it.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: gather/worker:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Migrations run at web boot; the worker queries tables they create.
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-gather}:${POSTGRES_PASSWORD:-gather}@db:5432/${POSTGRES_DB:-gather}
      GATHER_APP_URL: ${GATHER_APP_URL:-http://localhost:3000}
      # Not used to sign anything here, but the shared env schema requires it.
      GATHER_AUTH_SECRET: ${GATHER_AUTH_SECRET:-}
      GATHER_LOG_LEVEL: ${GATHER_LOG_LEVEL:-info}
      GATHER_DATA_DIR: /app/data
      MAIL_DRIVER: ${MAIL_DRIVER:-none}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_VALID_CERT: ${SMTP_REQUIRE_VALID_CERT:-true}
      GATHER_REMINDER_SCAN_MINUTES: ${GATHER_REMINDER_SCAN_MINUTES:-1}
      GATHER_REMINDER_BATCH: ${GATHER_REMINDER_BATCH:-50}
      GATHER_RETENTION_DAYS: ${GATHER_RETENTION_DAYS:-0}
      # The purge reads and deletes stored objects, so it needs the storage settings too.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-}
      STORAGE_ENCRYPTION: ${STORAGE_ENCRYPTION:-on}
      GATHER_ENCRYPTION_KEY: ${GATHER_ENCRYPTION_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - gather-data:/app/data

volumes:
  gather-db:
  gather-data:
