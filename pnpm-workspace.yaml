packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency lifecycle scripts by default. These are the ones our
# toolchain genuinely needs to compile native/optimised binaries at install time.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

# Security overrides. Each entry pins a transitive dependency above a published
# advisory that its parent has not yet picked up; `pnpm audit --prod --audit-level
# high` in CI is what will tell us when one can be dropped.
overrides:
  # GHSA path-traversal / arbitrary .map disclosure via sourceMappingURL — pulled in by next.
  postcss: '>=8.5.18'
  # libvips CVE-2026-33327/33328/35590/35591 — pulled in by next/image.
  sharp: '>=0.35.0'
  # Dev-server request forgery in esbuild <=0.24.2, reached through better-auth's
  # drizzle-kit peer via the deprecated @esbuild-kit/* shims.
  esbuild: '>=0.25.0'
