# Overrides for end-to-end runs:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# The only change is opening sign-ups. Each test run creates its own account rather than
# depending on leftover state, which the default `first-user-only` would refuse on a
# second run.
services:
  web:
    environment:
      GATHER_ALLOW_SIGNUP: open
